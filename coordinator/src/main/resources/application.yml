spring:
  profiles:
    active: local
  application:
    name: coordinator
  jpa:
    open-in-view: false

server:
  port: ${server.port:0}
  address: 0.0.0.0

cluster:
  coordinator:
    advertised-host: ${COORDINATOR_ADVERTISED_HOST:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

server:
  port: 8081

worker:
  name: ${HOSTNAME:local-worker}
  coordinator:
    url: ${COORDINATOR_URL:http://localhost:8080}
    api-key: ${COORDINATOR_API_KEY:admin_secret}
  heartbeat:
    interval-ms: ${HEARTBEAT_INTERVAL:5000}
  metrics:
    interval-ms: ${METRICS_INTERVAL:2000}
  connection:
    timeout-ms: ${CONNECTION_TIMEOUT:3000}

logging:
  level:
    com.cluster: DEBUG
